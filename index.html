<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Академ-Радар ТОГУ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#7a7a85);--link:var(--tg-theme-link-color,#2481cc);
  --btn:var(--tg-theme-button-color,#2481cc);--btn-text:var(--tg-theme-button-text-color,#fff);
  --card:var(--tg-theme-secondary-bg-color,#f1f3f6);
  --green:#2eb85c;--yellow:#f2a900;--red:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
header{padding:16px 16px 4px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;color:var(--hint);font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid rgba(128,128,128,.2);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--hint);border:0;background:none;cursor:pointer}
.tab span{display:block;font-size:20px}.tab.active{color:var(--btn);font-weight:600}
section{display:none;padding:12px 16px;animation:fade .25s}section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.subj{font-weight:600;font-size:15px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.g{background:var(--green)}.y{background:var(--yellow)}.r{background:var(--red)}
.bar{height:8px;background:rgba(128,128,128,.25);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;border-radius:6px;transition:width .5s}
.meta{font-size:12px;color:var(--hint);display:flex;justify-content:space-between}
.summary{display:flex;gap:10px;margin-bottom:12px}
.summary .card{flex:1;text-align:center;margin:0}.summary b{font-size:22px;display:block}
.slider-block{margin:14px 0}.slider-block label{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--btn)}
.result{text-align:center}.result .score{font-size:48px;font-weight:700}
.result .grade{font-size:20px;font-weight:600;margin:2px 0 8px}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--btn);color:var(--btn);background:none;font-size:13px;cursor:pointer}
.chip.active{background:var(--btn);color:var(--btn-text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--hint);font-weight:500;padding:6px 4px;font-size:12px}
td{padding:9px 4px;border-top:1px solid rgba(128,128,128,.18);vertical-align:middle}
.send{background:var(--btn);color:var(--btn-text);border:0;border-radius:8px;padding:6px 8px;font-size:11px;cursor:pointer}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><h1>🎓 Академ-Радар ТОГУ</h1><p>Прогноз успеваемости и раннее выявление рисков</p></header>

<section id="tab-dash" class="active">
  <div class="summary">
    <div class="card"><b id="avgBrs">–</b><span class="meta">Средний балл</span></div>
    <div class="card"><b id="avgAtt">–</b><span class="meta">Посещаемость</span></div>
  </div>
  <div id="subjects"></div>
</section>

<section id="tab-calc">
  <div class="card result">
    <div class="meta" style="justify-content:center">Прогнозируемый итоговый балл</div>
    <div class="score" id="finalScore">0</div>
    <div class="grade" id="finalGrade">–</div>
    <span class="badge" id="finalRisk">–</span>
  </div>
  <div class="card">
    <div class="slider-block"><label>Текущий балл БРС <b id="v1">45</b></label><input type="range" id="s1" min="0" max="100" value="45"></div>
    <div class="slider-block"><label>Баллы за будущие лабораторные <b id="v2">10</b></label><input type="range" id="s2" min="0" max="30" value="10"></div>
    <div class="slider-block"><label>Балл за экзамен/зачёт <b id="v3">15</b></label><input type="range" id="s3" min="0" max="30" value="15"></div>
    <div class="meta">Итог = текущий + лабораторные + экзамен (максимум 100)</div>
  </div>
</section>

<section id="tab-cur">
  <div class="card row"><div><div class="subj">Группа ПИ(б)-61</div><div class="meta">10 студентов</div></div>
    <div class="meta" id="groupStat"></div></div>
  <div class="chips">
    <button class="chip active" data-f="all">Все</button>
    <button class="chip" data-f="risk">Только группа риска 🔴🟡</button>
  </div>
  <div class="card scroll"><table>
    <thead><tr><th>Студент</th><th>БРС</th><th>Пропуски</th><th></th><th></th></tr></thead>
    <tbody id="groupBody"></tbody></table></div>
</section>

<nav class="tabs">
  <button class="tab active" data-t="tab-dash"><span>📊</span>Дашборд</button>
  <button class="tab" data-t="tab-calc"><span>🧮</span>Что, если?</button>
  <button class="tab" data-t="tab-cur"><span>👩‍🏫</span>Куратор</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const notify = (m) => (tg && tg.showAlert) ? tg.showAlert(m) : alert(m);
const haptic = () => { try { tg.HapticFeedback.selectionChanged(); } catch(e){} };

// Статус по баллу/посещаемости
function status(brs, att){
  if (brs >= 70 && att >= 75) return {c:'g', t:'🟢 В норме', col:'var(--green)'};
  if (brs >= 50 && att >= 55) return {c:'y', t:'🟡 Внимание', col:'var(--yellow)'};
  return {c:'r', t:'🔴 Риск', col:'var(--red)'};
}

// ---------- Данные ----------
const subjects = [
  {n:'Математический анализ', brs:64, att:82},
  {n:'Программирование',      brs:91, att:97},
  {n:'Физика',                brs:48, att:61},
  {n:'Линейная алгебра',      brs:73, att:88},
  {n:'Базы данных',           brs:35, att:45},
];
const students = [
  {n:'Иванов А.',   brs:92, miss:2},  {n:'Петрова М.',  brs:85, miss:4},
  {n:'Сидоров К.',  brs:74, miss:8},  {n:'Кузнецова Е.',brs:68, miss:10},
  {n:'Смирнов Д.',  brs:57, miss:18}, {n:'Попова Л.',   brs:52, miss:22},
  {n:'Васильев Н.', brs:46, miss:26}, {n:'Морозов И.',  brs:38, miss:34},
  {n:'Волкова О.',  brs:81, miss:6},  {n:'Лебедев Р.',  brs:29, miss:41},
];
const attOf = s => Math.max(0, 100 - s.miss * 100 / 60); // 60 занятий в семестре

// ---------- Вкладка 1 ----------
function renderDash(){
  document.getElementById('subjects').innerHTML = subjects.map(s=>{
    const st = status(s.brs, s.att);
    return `<div class="card">
      <div class="row"><span class="subj">${s.n}</span><span class="badge ${st.c}">${st.t}</span></div>
      <div class="bar"><i style="width:${s.brs}%;background:${st.col}"></i></div>
      <div class="meta"><span>БРС: <b>${s.brs}</b>/100</span><span>Посещаемость: <b>${s.att}%</b></span></div>
      <div class="bar" style="height:5px"><i style="width:${s.att}%;background:var(--link)"></i></div>
    </div>`}).join('');
  const avg = k => Math.round(subjects.reduce((a,s)=>a+s[k],0)/subjects.length);
  avgBrs.textContent = avg('brs'); avgAtt.textContent = avg('att') + '%';
}

// ---------- Вкладка 2 ----------
function recalc(){
  const a=+s1.value, b=+s2.value, c=+s3.value;
  v1.textContent=a; v2.textContent=b; v3.textContent=c;
  const total = Math.min(100, a+b+c);
  finalScore.textContent = total;
  let g, cls, txt;
  if (total < 50){ g='Незачёт / Неудовл.'; cls='r'; txt='🔴 Высокий риск'; }
  else if (total < 70){ g='Удовлетворительно'; cls='y'; txt='🟡 Зона внимания'; }
  else if (total < 85){ g='Хорошо'; cls='g'; txt='🟢 Риск низкий'; }
  else { g='Отлично'; cls='g'; txt='🟢 Риск минимальный'; }
  finalGrade.textContent = g;
  finalRisk.className = 'badge ' + cls; finalRisk.textContent = txt;
}
['s1','s2','s3'].forEach(id => document.getElementById(id).addEventListener('input', recalc));

// ---------- Вкладка 3 ----------
let filter = 'all';
function renderGroup(){
  const rows = students.map(s => ({...s, att: attOf(s), st: status(s.brs, attOf(s))}))
                       .filter(s => filter==='all' || s.st.c !== 'g');
  groupBody.innerHTML = rows.map(s=>`<tr>
      <td>${s.n}</td><td><b>${s.brs}</b></td><td>${s.miss}</td>
      <td><span class="badge ${s.st.c}">${s.st.t.split(' ')[0]}</span></td>
      <td><button class="send" onclick="remind('${s.n}')">🔔 Напомнить</button></td></tr>`).join('')
      || '<tr><td colspan="5" style="text-align:center;color:var(--hint)">Нет студентов</td></tr>';
  const avg = Math.round(students.reduce((a,s)=>a+s.brs,0)/students.length);
  const risk = students.filter(s=>status(s.brs, attOf(s)).c!=='g').length;
  groupStat.innerHTML = `Ср. балл: <b>${avg}</b><br>В риске: <b>${risk}</b>`;
}
function remind(name){ notify(`✅ Напоминание отправлено студенту: ${name}`); }
document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  ch.classList.add('active'); filter = ch.dataset.f; haptic(); renderGroup();
});

// ---------- Табы ----------
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); document.getElementById(t.dataset.t).classList.add('active'); haptic();
});

renderDash(); recalc(); renderGroup();
</script>
</body>
</html>
